services:
  db:
    platform: linux/amd64
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: whmcs
      MYSQL_USER: whmcs
      MYSQL_PASSWORD: whmcs
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  whmcs:
    platform: linux/amd64
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WHMCS_DB_HOST: db
      WHMCS_DB_NAME: whmcs
      WHMCS_DB_USER: whmcs
      WHMCS_DB_PASS: whmcs
    volumes:
      - ./whmcs:/var/www/html
      - ../../modules/addons/snapshot_pro:/var/www/html/modules/addons/snapshot_pro:ro

  mailhog:
    platform: linux/amd64
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db_data:
